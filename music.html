        // Function to generate blocks
        function createArtistBlock(artist, seasonId) {
            const subclusters = document.getElementById(seasonId);

            const subclusterDiv = document.createElement("div"); subclusterDiv.className = "subcluster";

            const header = document.createElement("h4"); header.textContent = artist.name; subclusterDiv.appendChild(header);

            artist.songs.forEach(song => {
                const songBlock = document.createElement("div"); songBlock.className = "song-block";

                const title = document.createElement("div"); title.className = "song-title"; title.textContent = song.title; songBlock.appendChild(title);

                const links = document.createElement("div"); links.className = "song-links";

                const playLink = document.createElement("a"); playLink.href = "#"; playLink.textContent = "▶️ Play"; playLink.dataset.audio = song.path; links.appendChild(playLink);

                const downloadLink = document.createElement("a"); downloadLink.href = song.path; downloadLink.download = ""; downloadLink.textContent = "⬇️ Download"; links.appendChild(downloadLink);

                songBlock.appendChild(links); subclusterDiv.appendChild(songBlock);
            });

            subclusters.appendChild(subclusterDiv);
        }

        // Generate Season 1
        [Daisy1, Meadowlark1, Sarge1, Sivle1].forEach(artist => createArtistBlock(artist, "season1"));
        // Generate Season 2
        //[Daisy2, Meadowlark2, Sarge2, Sivle2].forEach(artist => createArtistBlock(artist, "season2"));

        document.addEventListener("click", function (e) {
            if (e.target.matches("[data-audio]")) {
                e.preventDefault();
                mainAudio.src = e.target.dataset.audio; mainAudio.play();
